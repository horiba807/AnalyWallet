name: Supabase Database Backup

on:
  schedule:
    - cron: '0 19 * * *' # 毎日日本時間 午前4時（UTC 19:00）に自動実行
  workflow_dispatch:     # 手動実行ボタンを有効化

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL 17 Client and Rclone
        run: |
          sudo apt-get update
          sudo apt-get install -y curl gpg rclone

          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/postgresql.gpg
          echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list

          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      - name: Create Backup
        run: |
          /usr/lib/postgresql/17/bin/pg_dump "${{ secrets.SUPABASE_DB_URL }}" -F c -f backup_$(date +%Y%m%d_%H%M%S).dump

      - name: Setup Rclone Config
        env:
          RCLONE_CONFIG_DATA: ${{ secrets.RCLONE_CONFIG }}
        run: |
          mkdir -p ~/.config/rclone
          printf '%s\n' "$RCLONE_CONFIG_DATA" > ~/.config/rclone/rclone.conf

      - name: Upload to Google Drive
        run: |
          rclone copy backup_*.dump googledrive:Supabase_Backups/