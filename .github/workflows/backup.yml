name: Supabase Database Backup

on:
  schedule:
    - cron: '0 19 * * *' # 毎日日本時間午前4時（UTC 19:00）に実行
  workflow_dispatch:     # 手動実行ボタンを有効化

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL Client and Rclone
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client rclone

      - name: Create Backup
        run: |
          # 接続URLからpg_dumpを実行し圧縮保存
          pg_dump "${{ secrets.SUPABASE_DB_URL }}" -F c -f backup_$(date +%Y%m%d_%H%M%S).dump

      - name: Setup Rclone Config
        run: |
          mkdir -p ~/.config/rclone
          echo "${{ secrets.RCLONE_CONFIG }}" > ~/.config/rclone/rclone.conf

      - name: Upload to Cloud Storage
        run: |
          # gdrive:バックアップ先フォルダ名（OneDriveの場合は onedrive:フォルダ名）
          rclone copy backup_*.dump googledrive:Supabase_Backups/