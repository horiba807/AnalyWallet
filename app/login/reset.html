<html>

<head>
    <meta charset="utf-8">
    <title>パスワード再設定 - AnalyWallet</title>
    <link rel="stylesheet" href="../style/destyle.css">
    <link rel="stylesheet" href="../style/auth.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Albert+Sans:ital,wght@0,100..900;1,100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Noto+Sans+JP:wght@100..900&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <meta name="viewport" content="width=device-width, viewport-fit=cover">
    <link rel="icon" href="../img/favicon.ico">
    <link rel="manifest" href="../manifest.json" crossorigin="use-credentials">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="AnalyWallet">
    <link rel="apple-touch-icon" href="../img/icon-192.png">
</head>
<body>
    <header>
        <div class=header_wrapper>
            <div class="header_logo">
                <img src="../img/logo.svg">
            </div>
        </div>
    </header>
    <main>
        <div class="resetPass_modal">
            <h2>新しいパスワードの設定</h2>
            <p>新しいパスワード（12文字以上）を入力してください。</p>
            
            <form id="form-reset-password">
                <input type="password" id="input-reset-new-password" placeholder="新しいパスワード" required >
                
                <button type="submit">
                    パスワードを更新してログイン
                </button>
            </form>
        </div>
    </main>
    <div class="modal-wrapper" id="loginMFA-modal_wrapper">
        <div id="loginMFA-modal" class="loginMfa-modal">
            <div class="modal-content" style="text-align: center;">
                <h2>二段階認証</h2>
    
                <!-- ① 認証アプリ（TOTP）用フォーム -->
                <div id="mfa-totp-container">
                    <p>認証アプリに表示されている6桁のコードを入力してください。</p>
    
                    <!-- 💡 バックアップコード認証の注意点（Supabase AAL）についての警告表示 -->
                    <div id="aal-bypass-notice"
                        style="display: none; background: #fff3cd; color: #856404; font-size: 0.8rem; padding: 8px; margin-bottom: 10px; border-radius: 4px; text-align: left;">
                        ※バックアップコードでログインしました。認証アプリが手元に戻ったら設定を確認してください。
                    </div>
    
                    <input type="text" class="loginMFA-modal__input" id="login-mfa-code" placeholder="123456" maxlength="6">
                    <div>
                        <button type="button" class="loginMFA-modal__switch-btn"
                            id="btn-switch-to-backup">バックアップコードを使用する</button>
                    </div>
                </div>
    
                <!-- ② バックアップコード用フォーム（初期表示は非表示） -->
                <div id="mfa-backup-container" style="display: none;">
                    <p>保存した8桁のバックアップコードを入力してください。</p>
                    <input type="text" class="loginMFA-modal__input" id="login-backup-code" placeholder="ABCD-EFGH"
                        maxlength="9">
                    <div>
                        <button type="button" class="loginMFA-modal__switch-btn"
                            id="btn-switch-to-totp">認証アプリの6桁コードを入力する</button>
                    </div>
                </div>
    
                <button class="loginMFA-modal__form-btn" id="btn-login-mfa-verify" style="margin-top: 15px;">認証する</button>
            </div>
        </div>
    </div>
    <script type="module" src="@/common/auth/reset.js"></script>
</body>
</html>
